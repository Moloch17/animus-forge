# Stage 2 of the class/role curriculum: the same random characters as stage 1, now against a same-level creature that
# fights back, spawned out of aggro range. The bot has to move to it, pick its pet, open from stealth where it can, and
# kill it fast while losing little health. Episodes end on the kill or the bot's death.

extends: class_role.yaml
run_name: class_role_duel

# ~6 h at ~7k env steps/s; the plateau stop usually ends the stage sooner.
total_env_steps: 150000000

mappo:
  # Kills take tens of seconds of decisions including the approach: look further ahead.
  gamma: 0.997

eval:
  every_env_steps: 10000000
  baseline: fight

plateau:
  patience: 5
  min_env_steps: 30000000
