# Shared learner config for every class/role duel stage (warrior_dps_duel, druid_tank_duel, ...),
# used when the scenario has no configs/<scenario>.yaml of its own. The sim passes --run-name
# <scenario>, so each trains in runs/<scenario>/ and publishes <scenario>.amdl.
#
# Stage 2 of the curriculum: the same random characters as stage 1 (configs/class_role.yaml), now
# against a same-level creature that fights back, spawned out of aggro range. The bot has to move to
# it, pick its pet, open from stealth where it can, and kill it fast while losing little health.
# Episodes end on the kill or the bot's death.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf);
# everything here is learner-side.

run_name: class_role_duel
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# Seed a fresh run from the class/role's stage 1 model (runs/<class>_<role>/best.pt, else its latest.pt) when it exists:
# the duel's observations and actions extend stage 1's, so its damage rotation carries over.
init_from: runs/{base_run}/best.pt

total_env_steps: 300000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

rollout_device: cpu
train_device: cuda

mappo:
  # Must match configs/class_role.yaml for the seeding to apply.
  hidden: [512, 512]
  # Kills take tens of seconds of 50 ms decisions including the approach; look further ahead.
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true

# Seeded evaluation (animus.evaluation): every 20M env steps the networks play the same 128 characters and
# opponents with argmax actions; eval.csv / eval.jsonl hold the score (mean episode return) and per-level-band
# stats next to the "fight" baseline, scored once per run on the same seeds. The best networks go to best.pt
# and are the ones published and seeded from by the next stage.
eval:
  every_env_steps: 20000000
  at_start: true
  episodes: 128
  seed: 1000
  deterministic: true
  baseline: fight

# Stop once 5 evaluations in a row (100M env steps) fail to beat the best score by 2%, but not before 40M
# env steps; total_env_steps stays the upper bound. finished.json records why, and the queue moves on.
plateau:
  patience: 5
  min_improvement: 0.02
  min_improvement_abs: 0.01
  min_env_steps: 40000000
