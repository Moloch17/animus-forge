# Drill: a fixed healer seat beside its group. Stage 5 has healers, but its win is the clear, and stage 4 measured
# the seat putting 13% of its healing into the owner: triage is never what the episode is about. Here it is.
#
# WARNING before trusting a score from this stage: stage 5 carries a resurrection exploit that this drill inherits.
# Nothing clears m_resurrectGUID, so one landed Rebirth makes every later death of that ally an instant free
# resurrect that pays the revive reward again (stage9_companion measured druid_dps at 38.4 revives an episode, 88%
# of its return). A forced healer seat will find that faster than anything else in the curriculum. Fix it first.
#
# Trained by name (`forge start stage12_triage`), after stage10_party, which it seeds from. Not in the default queue.
extends: stage10_party.yaml
run_name: stage12_triage
total_env_steps: 150000000
convergence:
  patience: 2
  min_env_steps: 20000000

target:
  # These floors are deliberately conservative: a failed gate halts the whole queue, so they ask "did this stage
  # learn its lesson at all" rather than "is it good". Raise them once a full pass has given real numbers.
  # Seat 0 is always the healer. Keeping the group up is low_health_seconds; affording it is healing_per_mana,
  # and overheal is the failure mode this drill exists to find -- an early run of it sat at 0.73 overheal and
  # rising while the group survived, which is spam, not triage.
  min_over_baseline: 0.05
  metrics:
    low_health_seconds: {max: 18.0}
    pulls_cleared: {min: 3.5}
  role_metrics:
    heal:
      overheal_share: {max: 0.60}
      healing_per_mana: {min: 2.1}
  until_passed: true
