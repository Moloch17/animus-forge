# Stage 3 of the curriculum: pull after pull (1-4 creatures, sometimes an elite or a higher-level pack) with
# breaks between, until the bot dies or the episode ends. Heals, food and drink are there for recovering between pulls.
# Each cleared pull pays for speed and health kept. Give it long episodes (AnimusForge.EpisodeSeconds of several
# minutes) so there are many pulls.

extends: stage1_duel.yaml
run_name: stage3_gauntlet

# ~16 h at ~7k env steps/s; convergence usually ends the stage much sooner (the headroom is for restarts).
total_env_steps: 400000000

mappo:
  # Pulls and recovery span minutes: the longest horizon of the curriculum.
  gamma: 0.999

convergence:
  min_env_steps: 40000000
