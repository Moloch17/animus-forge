# Stage 3 of the curriculum: pull after pull (1-4 creatures, sometimes an elite or a higher-level pack) with
# breaks between, until the bot dies or the episode ends. Heals, food and drink are there for recovering between pulls.
# Each cleared pull pays for speed and health kept. Give it long episodes (AnimusForge.EpisodeSeconds of several
# minutes) so there are many pulls.

extends: stage1_duel.yaml
run_name: stage3_gauntlet

# ~16 h at ~7k env steps/s; convergence usually ends the stage much sooner (the headroom is for restarts).
total_env_steps: 400000000

# 256 decisions (25.6 s at 100 ms) per rollout: a pull, its recovery and the next pull's setup fit in fewer rollouts, so
# fewer returns rest on the critic's bootstrap.
rollout_length: 256

mappo:
  # Pulls and recovery span minutes: the longest horizon of the curriculum (~100 s). The GAE trace carries credit for
  # ~9 s: resting before a pull, sapping or stealthing in, and saving cooldowns pay off over that long.
  gamma: 0.999
  gae_lambda: 0.99

# An evaluation costs a wave of full episodes per 64 seeds, so it scales with the episode length, not with the
# training between evaluations: these episodes run minutes rather than the duel's 60 s, which makes a 1024-episode
# evaluation worth a sizeable share of the stage. Evaluate less often rather than on fewer episodes -- the score's
# standard error sets the convergence margin and the per-class/role gates, and it only grows as episodes are cut.
eval:
  every_env_steps: 15000000

convergence:
  min_env_steps: 40000000
