# Stage 9 of the curriculum: getting somewhere. A character of level 20 or more (riding and a mount of its level)
# starts in Old Hillsbrad with a place 60-320 yd away by path. Mounting takes a cast, so a short trip is faster on foot
# and a long one on a mount; the policy learns which, and to arrive on the ground ready to fight. Paid by potential
# shaping on the distance left, arriving (faster pays more), damage taken and death. Episodes end on arriving.

extends: stage1_duel.yaml
run_name: stage9_travel

# Trips take seconds to a minute: shorter than a fight, one policy for every class/role.
total_env_steps: 60000000

eval:
  baseline: fight
  report: [arrived, travel_seconds, start_distance, mounted_fraction, died]

convergence:
  min_env_steps: 20000000

# A sweep of the whole curriculum: every stage trains for at most total_env_steps and then moves on, whether or not
# it would have passed. The gates are cleared rather than left to the extended stage -- sections merge key by key, so
# an inherited `metrics` survives unless an empty map replaces it -- which disables the target (TargetConfig.enabled)
# and makes convergence and the budget both advance instead of halting the queue. Restore the gates for a run meant
# to prove a stage rather than to cover ground; they are in git history.
target:
  metrics: {}
  layout_metrics: {}
  role_metrics: {}
  arenas: {}
  difficulties: {}
  min_over_baseline: null
  min_layout_over_baseline: null
  until_passed: false
