# Stage 13 of the curriculum: a raid of eight groups of five against one elite and its adds, won or lost as the
# single pack is. The party stages taught a group of five; this asks whether the same policy holds together at
# forty, where threat, healing and standing out of things all scale differently.

extends: stage19_triage.yaml
run_name: stage24_raid_single

total_env_steps: 60000000

eval:
  baseline: fight
  report: [pulls_cleared, died, low_health_seconds, threat_share]

convergence:
  min_env_steps: 40000000

target:
  # Forty seats on one elite and its adds. A raid that clears while a third of it is dead has not learned to
  # raid, so the death rate is gated alongside the clear.
  min_over_baseline: 0.05
  metrics:
    pulls_cleared: {min: 0.80}
    died: {max: 0.25}
    # A raid has no scripted owner -- its arena is Opposition::Pulls with no Owner -- so OwnerEncounter never
    # runs and owner_deaths is never emitted. The party line above sets it, gates accumulate down the chain, and
    # a gate on a column the stage cannot produce fails as "not in the evaluation summary" and halts the queue
    # for good under until_passed. Dropped rather than the whole map cleared, which would take livelocked with it.
    owner_deaths: null
  until_passed: true
