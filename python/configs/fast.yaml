# Overlay for `forge fast`: a quick run of a few stages that still shows learning. The sim passes
# `--overlay configs/fast.yaml` to every stage's learner, and it is merged over that stage's whole config (extends chain
# included), before any --set. It is not a stage config of its own: never `extends` it or train it directly.
#
# The sim side of the fast profile (AnimusForge.Fast.*) makes the problem easier -- fewer envs, a few class/roles at one
# level -- in its own output directory. This file makes the learner end a stage as soon as it stops improving, like a
# real run but with small evaluations: a stage ends by convergence, and total_env_steps is only a safety cap. Networks,
# gamma, entropy, the evaluation baseline and seeding stay each stage's own, so a fast stage seeds from the fast runs of
# the stages it builds on, through the same code paths as a real run.
#
# Look at eval.csv: the at_start evaluation against the best, and the baseline in eval_baseline.json.

total_env_steps: 3000000
rollout_length: 128
checkpoint_every: 10
keep_checkpoints: 2

mappo:
  minibatches: 4

eval:
  every_env_steps: 100000
  episodes: 64

convergence:
  patience: 4
  window: 3
  min_env_steps: 500000

# No stage target: a short run is not held to the real gates, so the plan never halts on a fast stage. To test the gates
# and restarts too: AnimusForge.Fast.Learner.Args = "--set target.min_over_baseline=0.0".
target:
  min_over_baseline: null
  min_layout_over_baseline: null
  metrics: {}
  arenas: {}
  confirm_episodes: 64

restarts:
  max_restarts: 1
  entropy_half_life_env_steps: 200000
