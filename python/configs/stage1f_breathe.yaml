# Longer than a breath.
#
# One dive is free: the core's breath is three minutes (WaterBreath.Timer) and a lakebed sixteen yards down costs
# four seconds of it, so stage1e_dive never asks the seat to come up. Here the lakebeds come as a chain
# (ArenaDefinition::Checkpoints): reaching one draws the next thirty to sixty yards on, and the episode runs for
# four minutes rather than ending on arrival. A seat that stays down for the whole chain runs out of air at three
# minutes and drowns before the clock; one that surfaces between legs does not, and neither does one that makes the
# breath free first -- Unending Breath (warlock), Water Breathing (shaman), Aquatic Form (druid). Every class plays
# it and the spells are open.
#
# Success is being alive at four minutes. `checkpoints` says how far the chain got, `breaths` how often the seat
# came up, `breathing_casts` and `aquatic_seconds` which classes bought their air with a spell instead, and
# breath_spent (past 1 while drowning) and drowning_damage what it cost the ones that did neither.
#
# NOT in the default queue; trained by name after stage1e_dive:
#
#   forge start stage1f_breathe

extends: stage1e_dive.yaml
run_name: stage1f_breathe

total_env_steps: 24000000

eval:
  every_env_steps: 2000000
  trace_episodes: 64
  report: [died, drowned, checkpoints, chain_broken, dive, dive_depth, breaths, breath_spent, drowning_damage,
           breathing_casts, aquatic_seconds, swim_seconds, dive_seconds, arrived, travel_seconds, damage_taken,
           health_left, distance_travelled, spell_casts, timed_out]

target:
  # Alive at the end, every episode and every class. A chain episode runs to the clock by design, so timing out is
  # not a failure here and `saved` (the clock against the first leg) means nothing: the inherited floors on both
  # are dropped. `arrived` stays as "reached the first lakebed": a seat that never gets in cannot drown either,
  # and this floor is what keeps that from passing. `dive` keeps the placement honest, as in stage1e_dive.
  min_over_baseline: 0.0
  metrics:
    died: {max: 0.0}
    arrived: {min: 1.0}
    dive: {min: 0.95}
    timed_out: null
    saved: null
  layout_metrics:
    died: {max: 0.0}
    arrived: null
  arenas: {}
  until_passed: true
