# Stage 17: the same losing fight six levels up rather than ten, for every class and every race. Stealth is one
# way to get out of sight and the rarest -- four of the eighteen class/builds have a stealth aura in their kit --
# but it is not the lesson. The lesson is becoming unseen and staying unseen, which every class can do with
# terrain, with distance, and with whatever its kit and its race give it: Blink, Disengage, Feign Death,
# Invisibility, Sprint, Vanish, Prowl, and Shadowmeld for any night elf.
#
# Six levels rather than stage 16's ten so the fight is winnable often enough that hiding is a choice rather
# than the only move left. That is the difference between the two stages: stage 16 is about leaving a fight
# that is lost, this one is about not being found once you have.

extends: stage13_evade.yaml
run_name: stage14_hide
total_env_steps: 40000000

rollout_length: 256

mappo:
  gamma: 0.999
  gae_lambda: 0.995

eval:
  report: [escaped, re_hides, unseen_longest_seconds, survived, contact_breaks, unseen_seconds, re_stealths, stealth_openers, died]

target:
  # `escaped` is a single unbroken stretch out of sight long enough that the hunter lost the seat rather than
  # blinked (Evade.EscapeMs, 8 s), and `re_hides` is getting back out of sight after being found -- the harder
  # half, and the one every class can do. `re_stealths` and `stealth_openers` are reported, never gated:
  # fourteen class/builds have no stealth button, and gating on one would ask them for something they cannot do.
  #
  # Measured `fight` baseline on this arena, 2048 episodes over all eighteen layouts: escaped 0.079,
  # re_hides 0.240, contact_breaks 0.541, unseen_seconds 3.17, survived 0.551, won 0.450, and re_stealths
  # exactly 0.0000 -- the scripted baseline simply fights. Every one of the eighteen produced both gate metrics,
  # so no layout is being asked for something it has no way to do; the spread runs from warlock_dps (survived
  # 0.257) to deathknight_tank (0.781), which is what the layout floor is set against.
  #
  # `escaped` is the least certain of these floors: it is a rare event at baseline (one episode in thirteen),
  # and 0.20 asks for one in five. If a full run lands short of it while re_hides and survived pass, lower this
  # rather than assume the stage failed.
  min_over_baseline: 0.0
  min_layout_over_baseline: 0.0
  metrics:
    escaped: {min: 0.20, confidence: 0.95}
    re_hides: {min: 0.40}
    survived: {min: 0.60}
  layout_metrics:
    survived: {min: 0.30}
  until_passed: true
