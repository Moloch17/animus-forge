# Shared learner config for every class/role self-play arena stage (warrior_dps_arena, ...), used when the
# scenario has no configs/<scenario>.yaml of its own. The sim passes --run-name <scenario>.
#
# Stage 8 of the curriculum: self-play one-on-one. Envs pair up and each env's opponent is its partner's bot, the
# same class and role played by this same policy, so both sides of every fight are training data. Needs an even
# AnimusForge.Envs.
#
# Evaluation still runs on seeds, but against itself a policy's score says little about progress (both sides
# improve together), so there is no baseline and no plateau stop: the run trains to total_env_steps. Judge it by
# stage 7's evaluation: run the arena model on a <class>_<role>_pvp sim with animus.evaluate.

run_name: class_role_arena
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# Seed a fresh run from the class/role's PvP model: the arena stage has the same layout.
init_from: runs/{base_run}_pvp/best.pt

total_env_steps: 300000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

rollout_device: cpu
train_device: cuda

mappo:
  # Must match the earlier stages for the seeding to apply.
  hidden: [512, 512]
  gamma: 0.999
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true

# Seeded evaluation (animus.evaluation): every 20M env steps the networks play the same 128 characters and
# opponents with argmax actions; eval.csv / eval.jsonl hold the score (mean episode return) and per-level-band
# stats. The best networks go to best.pt
# and are the ones published and seeded from by the next stage.
eval:
  every_env_steps: 20000000
  at_start: true
  episodes: 128
  seed: 1000
  deterministic: true
  baseline: ""
  report: [won, dps, died, time_to_kill, damage_taken, cast_seconds_wasted]

# No plateau stop in self-play (see the top of this file).
plateau:
  patience: 0
