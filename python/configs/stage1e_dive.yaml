# Down again, into the water this time.
#
# stage1_move's water arena taught one decision, swim across or walk round, at the surface: nothing ever asked the
# seat to go under. Here the objective is on the bed of the Barrens oases under 6-40 yd of water, and arriving means
# standing on it. The breath is the core's own (WaterBreath.Timer, three minutes) and so is the drowning after it,
# a fifth of the seat's health a second; what the seat sees is how much of its breath is spent (OBS_SUBMERGED_TIME,
# run up under water and back down ten times as fast above it, as the core runs it) and how deep the place is, and
# what it learns is when to come up. The deep places cannot be reached on one breath.
#
# Unending Breath and Water Breathing are masked here (StageDefinition::WaterBreathingMasked), so every class learns
# the bare price of a dive first. stage1f_breathe gives the two classes that have one the button back.
#
# NOT in the default queue: a side branch off stage1_move like the other drills, trained by name:
#
#   forge start stage1e_dive

extends: stage1_move.yaml
run_name: stage1e_dive

total_env_steps: 30000000

convergence:
  min_env_steps: 8000000

eval:
  every_env_steps: 2000000
  trace_episodes: 64
  # dive: the episode was built on a lakebed at all (a spawn point with no deep water in reach builds a plain trip).
  # breaths, breath_spent (past 1 while drowning), drowning_damage and drowned are what the seat did with its air.
  report: [arrived, spl, lost, wedged, dive, dive_depth, swim_seconds, dive_seconds, breaths, breath_spent,
           drowning_damage, drowned, damage_taken, saved, travel_seconds, start_distance, walk_distance,
           distance_travelled, objective_distance_at_end, trip_share, died, timed_out]

target:
  # The movement phase's standard: the bot always arrives. No floor on drowning: a seat that drowns to learn is doing
  # the drill, and the outcome is arrival with travel_seconds and saved against the baseline.
  min_over_baseline: 0.0
  metrics:
    arrived: {min: 1.0}
    timed_out: {max: 0.0}
  layout_metrics:
    arrived: {min: 1.0}
  # One arena, `depths`: stage1_move's per-arena floors name arenas this stage does not have.
  arenas: {}
  until_passed: true
