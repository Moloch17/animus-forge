# Stage 5 of the curriculum: up to four learned agents per env -- a tank, a healer and damage dealers of
# random classes -- with the scripted owner as the fifth player, against elite-heavy packs. Every agent assists,
# guards and heals its teammates; tanks hold the pull, healers keep the party up, damage dealers stay off the threat
# table. Like the gauntlet, give it episodes of several minutes. Env steps count every agent's decisions.

extends: stage8_companion.yaml
run_name: stage9_party

# ~11 h at ~15k env steps/s (four seats); convergence usually ends the stage much sooner (the headroom is for restarts).
total_env_steps: 30000000

eval:
  every_env_steps: 20000000
  report: [dps, died, deaths, kills, pulls_cleared, wipes, owner_deaths, owner_healing, teammates_died,
    teammate_healing, threat_on_teammates, casts_completed, casts_cancelled, cancelled_stopped, cancelled_moved,
    cancelled_target, cancelled_other]

convergence:
  min_env_steps: 20000000

# A sweep of the whole curriculum: every stage trains for at most total_env_steps and then moves on, whether or not
# it would have passed. The gates are cleared rather than left to the extended stage -- sections merge key by key, so
# an inherited `metrics` survives unless an empty map replaces it -- which disables the target (TargetConfig.enabled)
# and makes convergence and the budget both advance instead of halting the queue. Restore the gates for a run meant
# to prove a stage rather than to cover ground; they are in git history.
target:
  metrics: {}
  layout_metrics: {}
  role_metrics: {}
  arenas: {}
  difficulties: {}
  min_over_baseline: null
  min_layout_over_baseline: null
  until_passed: false
