# Stage 5 of the class/role curriculum: up to four learned agents per env -- a tank, a healer and damage dealers of
# random classes -- with the scripted owner as the fifth player, against elite-heavy packs. Every agent assists,
# guards and heals its teammates; tanks hold the pull, healers keep the party up, damage dealers stay off the threat
# table. Like the gauntlet, give it episodes of several minutes. Env steps count every agent's decisions.

extends: stage4_companion.yaml
run_name: stage5_party

# ~5.5 h at ~15k env steps/s (four seats); the plateau stop usually ends the stage sooner.
total_env_steps: 300000000

eval:
  every_env_steps: 20000000
  report: [dps, died, deaths, kills, pulls_cleared, wipes, owner_deaths, owner_healing, teammates_died,
    teammate_healing, threat_on_teammates, casts_completed, casts_cancelled, cancelled_stopped, cancelled_moved,
    cancelled_target, cancelled_other]

plateau:
  min_env_steps: 60000000
