# Learner config for stage1_duel, stage 1 of the curriculum, and the root every later stage extends: one
# policy for every class/role of AnimusForge.ClassRoles (all 18 by default). Each class/role is a layout: its own input
# adapter and action head around a shared trunk. The run trains in <runs_dir>/stage1_duel/; export writes one model
# per class/role (warrior_dps_duel.amdl, ...).
#
# Every episode is a new character: race, gender, level 1-80, spec, talents and gear are all random, and the policy
# sees them in its observation. It faces a same-level creature that fights back, spawned out of aggro range: the bot
# has to move to it, pick its pet, open from stealth where it can, and kill it fast while losing little health.
# Episodes end on the kill or the bot's death.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf), where runs go and what
# a stage seeds from (its stage.json); everything here is learner-side. Later stages list only what they change.

run_name: stage1_duel
socket: /tmp/animus-forge.sock
seed: 1

# Seed from the closest earlier stage that has been trained (the stage's seed chain in stage.json). The duel is the
# first stage: its chain is empty, so its networks start from scratch.
init_from: auto

# One policy has to cover 80 levels, every race and spec of the class and random builds and gear, so it needs far
# more experience than a single-character scenario. At 64 envs one update is 128 x 64 = 8192 env steps.
# ~12 h at ~7k env steps/s: convergence usually ends the stage much sooner; the headroom is for up to two restarts
# (see restarts).
total_env_steps: 300000000
rollout_length: 128

# Update the networks on a worker thread while the sim collects the next rollout, instead of standing idle for it
# (~20% more env steps per second here). The rollout then acts on the update before last: one update staler than
# the serial loop, which PPO's clipping already accounts for.
overlap_updates: true
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

# Updates on the GPU when torch sees one (CUDA or ROCm), else the CPU. Rollouts stay on the CPU: one forward pass per
# decision is faster there.
train_device: auto
rollout_device: cpu

mappo:
  # Wide enough to condition a rotation on level, spec, talents, gear stats and a large action space. Every stage
  # keeps these sizes, or seeding from the earlier stage cannot copy the trunk.
  hidden: [512, 512]
  # gamma and gae_lambda are per 100 ms of game time (reference_decision_ms), compounded to AnimusForge.DecisionMs, so
  # horizons stay the same in seconds at any decision interval; the learner prints them at start.
  # Kills take tens of seconds including the approach: a ~33 s horizon. The GAE trace (gamma x lambda) carries credit
  # without the critic for ~5.5 s (0.95 gave ~2 s), long enough to tie a stealthy approach or a pet pull to the opener that pays for it.
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  clip: 0.2
  value_clip: 0.2
  # Large action spaces with delayed payoffs need steady exploration.
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true
  # The value normaliser follows the returns, which drift upwards as the policy learns to kill: stats that
  # averaged the whole run would leave the critic fitting a scale it had outgrown, and value_loss (reported in
  # normalised space) would shrink whether or not the fit improved. Watch explained_variance instead.
  value_norm_beta: 0.99
  # Each class/role's advantages are centred and scaled on its own rows. They share a trunk, and their returns
  # are not on one scale -- a healer keeping an owner alive and a rogue killing a creature are different numbers
  # -- so one global scale would let the widest-spread class/role speak for weights all of them use.
  per_layout_advantages: true
  min_layout_rows: 32
  # Stop an update once its epochs have moved the policy about this far in KL. Clipping bounds one step, not
  # four epochs of them over one rollout; the observed approx_kl runs ~0.03 here, so this is a ceiling rather
  # than a leash. 0 turns it off.
  target_kl: 0.04

# Seeded evaluation (animus.evaluation): every every_env_steps the networks play the same 1024 characters and
# opponents with argmax actions; eval.csv / eval.jsonl hold the score (mean episode return) and per-level-band and
# per-class/role stats next to the baseline, scored once per run on the same seeds, and eval_episodes.jsonl every
# episode behind them. The best networks go to best.pt and are the ones the next stage seeds from.
#
# 1024 episodes spread over the 18 class/roles leave ~57 each: enough that a class/role's score means something and
# that the convergence margin (which is set by the score's standard error) tracks learning rather than noise. The
# whole evaluation is ~80 s of sim time against the ~30 min of training between two of them.
eval:
  every_env_steps: 10000000
  at_start: true
  episodes: 1024
  seed: 1000
  deterministic: true
  baseline: fight

# Done learning: `patience` evaluations in a row set no new best -- one has to beat the best by 2% and by 2 standard
# errors of the two scores, so a lucky evaluation does not count -- and the trend of the last 4 scores is flat too;
# not before min_env_steps (counted again after each restart). total_env_steps stays the upper bound.
convergence:
  patience: 5
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  min_env_steps: 30000000

# Good enough to move on: the best networks beat the fight baseline by 10% overall and match it for every
# class/role, on the evaluation that set the best and then again on 2048 held-out episodes (a best picked from many
# evaluations is partly luck). Each score gate allows noise_z standard errors of noise, so a class/role that is
# really level with its baseline is not failed by the luck of its share of the seeds. These are starting guesses:
# tune them after a pilot run (eval.jsonl has each class/role's score next to the baseline's). Metric gates check
# episode info means directly, e.g. metrics: {killed: {min: 0.8}, died: {max: 0.2}}.
target:
  min_over_baseline: 0.1
  min_layout_over_baseline: 0.0
  min_layout_episodes: 16
  noise_z: 1.0
  metrics: {}
  confirm_episodes: 2048
  confirm_seed: 50000

# Exploration has a floor, measured against what the mask allowed. A masked policy's ceiling is
# ln(legal actions) -- about ln(9) in this stage, not ln(82) -- so a flat coefficient says little about whether
# the policy still explores. Below 30% of that ceiling the coefficient climbs (up to 4x), and it falls straight
# back once entropy recovers, so a policy converging on its own is never held open. allowed_actions and entropy
# in metrics.csv are the pair to read. fraction: 0 turns it off.
entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

# Where the data goes: after every evaluation the sim is told how often to build each class/role, so the ones
# furthest below their baseline -- the ones the per-class/role gate turns on -- get more episodes than the ones
# already clear of it. Evaluation stays evenly spread over the class/roles whatever the weights are.
layout_sampling:
  enabled: true
  strength: 1.0
  max_ratio: 3.0

# Converged below the target is a local optimum: restart from best.pt with 3x the entropy bonus (decaying back with a
# 10M env step half-life) and fresh optimizers, at most twice. After that -- or at total_env_steps below the target --
# the learner exits with code 3 and the queue halts on this stage.
restarts:
  max_restarts: 2
  entropy_boost: 3.0
  entropy_half_life_env_steps: 10000000
  reset_optimizers: true
  shrink: 1.0
  perturb: 0.0
