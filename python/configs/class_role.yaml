# Shared learner config for every class/role scenario (warrior_dps, druid_tank, ...), used when the
# scenario has no configs/<scenario>.yaml of its own. The sim passes --run-name <scenario>, so each
# scenario still trains in runs/<scenario>/ and publishes <scenario>.amdl.
#
# Every episode is a new character: race, gender, level 1-80, spec, talents and gear are all random,
# and the policy sees them in its observation. Observations are a few hundred features (61 global,
# 5 per action, one per talent) and a class has roughly 50-120 actions.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf);
# everything here is learner-side.

run_name: class_role
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# One policy has to cover 80 levels, every race and spec of the class and random builds and gear, so
# it needs far more experience than the single-character scenarios. At 64 envs one update is
# 128 x 64 = 8192 env steps; 300M is ~36 600 updates, roughly 780 000 60-second episodes. Raise it for
# a class whose metrics are still improving: --resume-latest continues from where the run stopped.
total_env_steps: 300000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

# Updates run on the GPU ("cuda" is PyTorch ROCm's name for AMD GPUs; the dev server exposes only
# the discrete card). Rollouts stay on the CPU: one forward pass per decision is faster there.
rollout_device: cpu
train_device: cuda

mappo:
  # Wide enough to condition a rotation on level, spec, talents, gear stats and a large action space.
  hidden: [512, 512]
  # Decisions are 50 ms apart; DoTs, buffs and cooldowns pay off over many seconds, so 0.995 (a ~200
  # decision, 10 s horizon).
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  # Large action spaces with delayed payoffs need steady exploration.
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true
