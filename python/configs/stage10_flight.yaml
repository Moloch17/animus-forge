# Stage 10 of the curriculum: flying. Characters of level 60 or more (Expert Riding and a flying mount; Artisan and a
# fast one from 70) start in Outland's Nagrand, where flying mounts fly, with a place 350-700 yd away. Flying is several
# times faster than riding and passes over everything, but dismounting in the air falls with a player's fall damage:
# the policy learns to take off, keep a height, land and then dismount. Battlegrounds never allow flying mounts, so
# this is for the open world. Seeded from stage9_travel.

extends: stage9_travel.yaml
run_name: stage10_flight

total_env_steps: 150000000

mappo:
  # A trip of 700 yd plans takeoff and landing tens of seconds apart.
  gamma: 0.999
  gae_lambda: 0.99

eval:
  report: [arrived, travel_seconds, start_distance, mounted_fraction, flying_fraction, died]
