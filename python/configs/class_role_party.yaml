# Learner config for class_role_party, stage 6 of the class/role curriculum: four learned agents per env -- a tank,
# a healer and two damage dealers of random classes -- with the scripted owner as the fifth player, against
# elite-heavy packs. Every agent assists, guards and heals its teammates; tanks hold the pull, healers keep the party
# up, damage dealers stay off the threat table. Episodes end when the owner dies or every agent has.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf). Like the gauntlet,
# give it episodes of several minutes. env steps count every agent's decisions (4 per env per decision here).

run_name: class_role_party
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# Seed a fresh run from the companion stage: each layout extends the companion stage's.
init_from: runs/{base_run}_companion/best.pt

total_env_steps: 300000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

rollout_device: cpu
train_device: cuda

mappo:
  # Must match the earlier stages for the seeding to apply.
  hidden: [512, 512]
  gamma: 0.999
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true

# Seeded evaluation (animus.evaluation): every 20M env steps the networks play the same 128 characters and
# opponents with argmax actions; eval.csv / eval.jsonl hold the score (mean episode return) and per-level-band
# stats (overall, per level band and per class/role) next to the "fight" baseline, scored once per run on
# the same seeds. The best networks go to best.pt
# and are the ones published and seeded from by the next stage.
eval:
  every_env_steps: 20000000
  at_start: true
  episodes: 128
  seed: 1000
  deterministic: true
  baseline: fight
  report: [dps, died, kills, pulls_cleared, owner_died, owner_healing, members_died, member_healing,
    threat_on_members, cast_seconds_wasted]

# Stop once 5 evaluations in a row (100M env steps) fail to beat the best score by 2%, but not before 40M
# env steps; total_env_steps stays the upper bound. finished.json records why, and the queue moves on.
plateau:
  patience: 5
  min_improvement: 0.02
  min_improvement_abs: 0.01
  min_env_steps: 40000000
