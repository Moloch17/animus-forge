# Drill: a fixed tank seat beside its group. Tanks play in stages 5, 8, 13 and 14, but those are won by the clear,
# so a tank that loses an add and takes it back scores the same as one that never lost it. Here seat 0 is always the
# tank and the episode is about the threat table, which the seat can now read (Encoding::ThreatShare).
#
# Read its scores knowing the hazard charge lands about four times harder on a tank than on a ranged seat
# (stage7_arena: paladin_tank -0.834 an episode against priest_dps -0.198): a tank cannot walk out of what it is
# holding an enemy in, and Hazards.Standing was tuned for a seat with a choice.
#
# Trained by name (`forge start stage16_tanking`), after stage5_party, which it seeds from. Not in the default queue.
extends: stage5_party.yaml
run_name: stage16_tanking
total_env_steps: 150000000
convergence:
  patience: 2
  min_env_steps: 20000000
