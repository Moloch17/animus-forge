# Drill: a fixed tank seat beside its group. Tanks play in stages 5, 8, 13 and 14, but those are won by the clear,
# so a tank that loses an add and takes it back scores the same as one that never lost it. Here seat 0 is always the
# tank and the episode is about the threat table, which the seat can now read (Encoding::ThreatShare).
#
# Read its scores knowing the hazard charge lands about four times harder on a tank than on a ranged seat
# (stage13_arena: paladin_tank -0.834 an episode against priest_dps -0.198): a tank cannot walk out of what it is
# holding an enemy in, and Hazards.Standing was tuned for a seat with a choice.
#
# Trained by name (`forge start stage16_tanking`), after stage15_party, which it seeds from. Not in the default queue.
extends: stage15_party.yaml
run_name: stage16_tanking
total_env_steps: 150000000
convergence:
  patience: 2
  min_env_steps: 20000000

target:
  # Seat 0 is always the tank. Holding what the pull brings is threat_share; keeping it off the others is
  # threat_on_teammates, and a tank that tops threat while its group is being chewed has not held anything.
  min_over_baseline: 0.05
  # No build floors here. These used to be role_metrics, which could say "every tank" in one line; a build gate
  # names builds, and a shared config does not know which classes a run plays. Per-build floors live in
  # configs/<class>/<stage>.yaml, where they can name that class's builds -- see configs/druid/.
  metrics:
    pulls_cleared: {min: 3.5}
  until_passed: true
