# Stage 6 of the curriculum: one-on-one against a scripted enemy player of a random class and role near
# the bot's level. Episodes end when either dies; the reward is the duel's (damage, a fast kill, little damage taken,
# casts).

extends: stage1_duel.yaml
run_name: stage6_pvp

mappo:
  # A fight is shaped by what happened tens of seconds earlier (a stealthy approach, a trinket baited out, a cooldown
  # saved): ~100 s horizon, ~9 s GAE trace.
  gamma: 0.999
  gae_lambda: 0.99

eval:
  report: [won, dps, died, time_to_kill, damage_taken, cast_seconds_wasted]
