# The restoration druid's drill, and the leaf of the class curriculum: the last stage before the druid meets the
# other nine classes and the director.
#
# Its pinned seat is a build that can keep the hurt one up, which in a druid-only run is restoration. What makes
# the druid's version of this its own lesson is that its healing is mostly over time rather than on demand, and
# that it has to shift out of a form to cast at all -- so overhealing and healing per mana read differently for
# it than for a paladin, and the floors are set against what a druid actually does.

extends: ../stage17_triage.yaml
run_name: stage17_triage

eval:
  report: [low_health_seconds, overheal_share, healing_per_mana, hot_healing_share, pulls_cleared, wipes]

target:
  spec_metrics:
    restoration:
      low_health_seconds: {max: 18}
      # Looser than a paladin's would be: a heal over time landing on somebody who has since been topped up is
      # counted as overheal, and casting those early is what a druid is supposed to do.
      overheal_share: {max: 0.65}
      healing_per_mana: {min: 2.1}
