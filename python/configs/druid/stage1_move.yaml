# The druid's movement root. Inherits everything from the shared stage and adds the floors that are about it.
#
# The druid is the class that makes this stage worth putting first. It has a speed form at 30 (Travel Form,
# instant and free where a mount is a cast), a sprint at 20 inside Cat Form (Dash), and -- the part nothing else
# has -- Aquatic Form at 16, which breathes underwater and swims faster than anything can run. So the water arena
# asks it a question it can answer better than any other class, and the answer is different for each of its
# builds only in so far as the level is.

extends: ../stage1_move.yaml
run_name: stage1_move

target:
  spec_metrics:
    # Every build has to cross ground. A restoration druid is not excused for being a healer -- there is no such
    # thing here, only a build, and this one has the same legs the others do.
    balance:
      arrived: {min: 0.88, confidence: 0.95}
    feral_cat:
      arrived: {min: 0.88, confidence: 0.95}
    feral_bear:
      arrived: {min: 0.88, confidence: 0.95}
    restoration:
      arrived: {min: 0.88, confidence: 0.95}
