# Stage 20, the crossroads: the PvE and PvP branches join in one policy. Every episode is one of the
# stage's arenas (weights in the stage definition): the companion's and the party's gauntlets, self-play and scripted
# one-on-ones, the solo gauntlet and duel, and two new situations -- an ambush of the owner by 1-2 enemy players in the
# middle of a gauntlet, and a lone enemy player attacking the owner (escort_duel). The context and hostiles blocks let
# the policy tell them apart as a live server would. PvE arenas run 5-minute episodes, one-on-ones 60-90 s.
#
# Seeding: the trunk and PvE blocks from stage10_party; the pvp block from stage16_arena (merges). Distillation: each
# arena is taught by the first parent that has it (party by stage10_party, arena_1v1 by stage16_arena, pvp_scripted by
# stage15_pvp, companion by stage9_companion, gauntlet by stage4_gauntlet, duel by stage1_duel); the new arenas learn
# from the reward alone.

extends: stage10_party.yaml
run_name: stage20_crossroads

# ~20 h at ~15k env steps/s (up to four seats); convergence usually ends the stage sooner.
total_env_steps: 150000000

mappo:
  gamma: 0.999

distill:
  teachers: auto
  coef: 1.0
  half_life_env_steps: 50000000

eval:
  episodes: 256
  every_env_steps: 25000000
  # The arena_1v1 seat is scored against fight as its opponent.
  opponent_baseline: true
  report: [dps, died, won, kills, pulls_cleared, wipes, owner_deaths, owner_healing, teammates_died, ambushers,
    ambushers_killed, casts_completed, casts_cancelled]

convergence:
  min_env_steps: 20000000

# Every situation holds up on its own, not only on average; the new arenas only need to beat the fight baseline.
target:
  # These floors are deliberately conservative: a failed gate halts the whole queue, so they ask "did this stage
  # learn its lesson at all" rather than "is it good". Raise them once a full pass has given real numbers.
  # This is the stage that gets exported, so it is the most gated one, and gated per arena rather than overall:
  # a policy excellent at the gauntlet that has forgotten how to duel would pass a single averaged floor, and
  # the whole point of the join is that no earlier situation regressed.
  min_over_baseline: 0.15
  min_layout_over_baseline: 0.0
  min_layout_episodes: 32
  metrics:
    owner_deaths: {max: 0.30}
  arenas:
    companion:
      metrics:
        owner_deaths: {max: 0.30}
        pulls_cleared: {min: 3.5}
    party:
      metrics:
        pulls_cleared: {min: 3.0}
    duel:
      metrics:
        clean_kill: {min: 0.70, confidence: 0.95}
    pvp_scripted:
      metrics:
        clean_kill: {min: 0.35, confidence: 0.95}
  confirm_episodes: 4096
  until_passed: true
