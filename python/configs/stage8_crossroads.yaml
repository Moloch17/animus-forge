# Stage 8 of the curriculum, the crossroads: the PvE and PvP branches join in one policy. Every episode is one of the
# stage's arenas (weights in the stage definition): the companion's and the party's gauntlets, self-play and scripted
# one-on-ones, the solo gauntlet and duel, and two new situations -- an ambush of the owner by 1-2 enemy players in the
# middle of a gauntlet, and a lone enemy player attacking the owner (escort_duel). The context and hostiles blocks let
# the policy tell them apart as a live server would. PvE arenas run 5-minute episodes, one-on-ones 60-90 s.
#
# Seeding: the trunk and PvE blocks from stage5_party; the pvp block from stage7_arena (merges). Distillation: each
# arena is taught by the first parent that has it (party by stage5_party, arena_1v1 by stage7_arena, pvp_scripted by
# stage6_pvp, companion by stage4_companion, gauntlet by stage3_gauntlet, duel by stage1_duel); the new arenas learn
# from the reward alone.

extends: stage5_party.yaml
run_name: stage8_crossroads

# ~20 h at ~15k env steps/s (up to four seats); convergence usually ends the stage sooner.
total_env_steps: 1000000000

mappo:
  gamma: 0.999

distill:
  teachers: auto
  coef: 1.0
  half_life_env_steps: 50000000

eval:
  episodes: 256
  every_env_steps: 25000000
  # The arena_1v1 seat is scored against fight as its opponent.
  opponent_baseline: true
  report: [dps, died, won, kills, pulls_cleared, wipes, owner_deaths, owner_healing, teammates_died, ambushers,
    ambushers_killed, casts_completed, casts_cancelled]

convergence:
  min_env_steps: 100000000

# Every situation holds up on its own, not only on average; the new arenas only need to beat the fight baseline.
target:
  min_arena_episodes: 16
  arenas:
    companion: {min_over_baseline: 0.1}
    party: {min_over_baseline: 0.1}
    arena_1v1: {min_over_baseline: 0.1}
    pvp_scripted: {min_over_baseline: 0.1}
    gauntlet: {min_over_baseline: 0.1}
    duel: {min_over_baseline: 0.1}
    ambush: {min_over_baseline: 0.0}
    escort_duel: {min_over_baseline: 0.0}
