# Level 20 Arms human warrior vs training dummy (AnimusForge.Scenario = "warrior_dummy_20").
#
# 11 actions (Heroic Strike, Cleave, cancel, Rend, Thunder Clap, Battle Shout, Bloodrage, Overpower,
# Hamstring, Mocking Blow, no-op) and 29 observations (19 combat features + 10 Arms talent ranks).
# The talent build is redrawn every episode from all 1371 valid 11-point Arms builds, so the policy
# has to learn a rotation conditioned on the build it is given.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf);
# everything here is learner-side.

run_name: warrior_dummy_20
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# A much bigger problem than warrior_dummy: cooldowns, a GCD, buffs and debuffs to maintain,
# reactive Overpower windows, and a different optimum per talent build. At 64 envs one update is
# 128 x 64 = 8192 env steps; 50M is ~6100 updates, roughly 40 000 60-second episodes.
total_env_steps: 50000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

# Updates run on the GPU ("cuda" is PyTorch ROCm's name for AMD GPUs; the dev server exposes only
# the discrete card). Rollouts stay on the CPU: one small forward pass per decision is faster there.
rollout_device: cpu
train_device: cuda

mappo:
  # Wider than warrior_dummy: the policy must combine 10 talent features with the combat state.
  hidden: [256, 256]
  # Decisions are 50 ms apart. Rend lasts 15 s and Bloodrage/Mocking Blow have 60 s cooldowns, so
  # look further ahead than the level 1 scenario: 0.995 is a ~200-decision (10 s) horizon.
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  # More exploration: 11 actions, several of which only pay off seconds later.
  entropy_coef: 0.02
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 5
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
