# Learner config for stage2_pack, stage 2 of the class/role curriculum: the duel's random characters against a
# pack of 2-4 same-level creatures, casters included, usually linked. The policy picks targets, interrupts,
# crowd-controls and clears the pack fast while losing little health. Episodes end when the pack is cleared or the
# bot dies.
#
# The sim decides the env count, decision interval and episode length (mod_animus_forge.conf).

run_name: stage2_pack
runs_dir: runs
socket: /tmp/animus-forge.sock
seed: 1

# Seed from the closest earlier stage that has been trained (the first candidate that exists): each
# layout extends the earlier stage's, and the trunk carries over.
init_from:
  - runs/stage1_duel/best.pt

# Budget sized from throughput: 150M env steps is ~6 h at ~7k env steps/s (one seat, like the duel).
# The plateau stop usually ends the stage sooner.
total_env_steps: 150000000
rollout_length: 128
log_every: 1
checkpoint_every: 25

rollout_device: cpu
train_device: cuda

mappo:
  # Must match the earlier stages for the seeding to apply.
  hidden: [512, 512]
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  epochs: 4
  minibatches: 8
  max_grad_norm: 0.5
  use_value_norm: true

# Seeded evaluation (animus.evaluation): every 20M env steps the networks play the same 128 characters and
# opponents with argmax actions; eval.csv / eval.jsonl hold the score (mean episode return) and per-level-band
# stats (overall, per level band and per class/role) next to the "fight" baseline, scored once per run on
# the same seeds. The best networks go to best.pt
# and are the ones the next stage seeds from.
eval:
  every_env_steps: 10000000
  at_start: true
  episodes: 128
  seed: 1000
  deterministic: true
  baseline: fight

# Stop once 5 evaluations in a row (50M env steps) fail to beat the best score by 2%, but not before
# 30M env steps; total_env_steps stays the upper bound. finished.json records why, and the queue moves on.
plateau:
  patience: 5
  min_improvement: 0.02
  min_improvement_abs: 0.01
  min_env_steps: 30000000
