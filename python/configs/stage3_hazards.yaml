# Drill: something on the ground in every pull. Hazards are not new to the curriculum -- the pack ladder draws a
# hazard caster from rung 3, and self-play makes them by the spell (stage16_arena measured 3.1 s of hazard an episode,
# stage4_gauntlet 1.1 s) -- but a class/role that stalls below rung 3 never meets one, and a second an episode is
# thin to learn from. Here every pull has one at stage 2's difficulty, so walking out of it is what the episode is
# about rather than a detail of a harder fight.
#
# Trained by name (`forge start stage3_hazards`), after stage2_pack, which it seeds from. Not in the default queue.
extends: stage2_pack.yaml
run_name: stage3_hazards
# A drill, not a stage of the curriculum: it is there to move one behaviour, and the behaviour shows early.
total_env_steps: 60000000
convergence:
  patience: 2
  min_env_steps: 15000000

target:
  # Every pull has something on the ground. The clear rate must hold while the time spent standing in it falls:
  # the charge lands about four times harder on a tank, so the per-role floor is looser than the overall one.
  min_over_baseline: 0.05
  metrics:
    pulls_cleared: {min: 0.85}
    hazard_seconds: {max: 4.0}
  role_metrics:
    tank:
      hazard_seconds: {max: 8.0}
  until_passed: true
