# Stage 15: one-on-one against a scripted enemy player of a random class and role near
# the bot's level. Episodes end when either dies; the reward is the duel's (damage, a fast kill, little damage taken,
# casts).

extends: stage1_duel.yaml
run_name: stage15_pvp
total_env_steps: 60000000

# gamma below is a ~100 s horizon, so a 128-decision rollout (12.8 s) would leave nearly every return to the
# critic's bootstrap. 256 covers 25.6 s of it, as the gauntlet line does.
rollout_length: 256

# The GAE trace decides how far credit reaches back: at lambda 0.99 per 100 ms it was about 9 s, while a pull, its
# recovery and the setup that made it winnable take 30-60 s, so what caused an outcome fell outside the trace and was
# learned only through the critic. 0.995 is about 17 s of credit, for more variance than the critic (explained variance
# ~0.93 through stages 2 and 3) has trouble with.
mappo:
  # A fight is shaped by what happened tens of seconds earlier (a stealthy approach, a trinket baited out, a cooldown
  # saved): ~100 s horizon, ~17 s GAE trace.
  gamma: 0.999
  gae_lambda: 0.995

eval:
  report: [won, dps, died, time_to_kill, damage_taken, cast_seconds_wasted]

target:
  # A scripted enemy player fights back, heals and casts, so this is the first stage where an interrupt is worth
  # more than damage. clean_kill is the honest read of a duel: killed it and never died.
  min_over_baseline: 0.10
  min_layout_over_baseline: 0.0
  metrics:
    clean_kill: {min: 0.55, confidence: 0.95}
    interrupts: {min: 1.0}
  layout_metrics:
    clean_kill: {min: 0.35}
  until_passed: true
