# Stage 7 of the class/role curriculum: one-on-one against a scripted enemy player of a random class and role near
# the bot's level. Episodes end when either dies; the reward is the duel's (damage, a fast kill, little damage taken,
# casts).

extends: class_role_duel.yaml
run_name: class_role_pvp

mappo:
  gamma: 0.999

eval:
  report: [won, dps, died, time_to_kill, damage_taken, cast_seconds_wasted]
